# ════════════════════════════════════════════════════════════════
#  AI Trading Assistant – configuration
# ════════════════════════════════════════════════════════════════

llm:
  provider: groq
  model: meta-llama/llama-4-scout-17b-16e-instruct
  temperature: 0.1          # low temp for deterministic financial analysis
  max_tokens: 4096
  streaming: true

confidence:
  threshold: 75             # HARD GATE – must be strictly > this
  weights:
    indicator_confluence: 0.25   # EMA, RSI, MACD, volume, S/R agreement
    multi_timeframe:       0.15   # weekly + daily + intraday alignment
    backtest_edge:         0.25   # win rate, profit factor, expectancy
    market_regime:         0.10   # Nifty trend, VIX, FII/DII flows
    liquidity_quality:     0.05   # avg traded value, no circuit issues
    fundamentals_news:     0.10   # no red flags, no pending events
    agent_track_record:    0.10   # past signal performance from DB

backtest:
  lookback_years: 5
  min_trades: 30                  # minimum trades for valid backtest
  commission_pct: 0.03            # brokerage 0.03% per leg
  stt_pct: 0.1                    # STT on sell side (delivery)
  slippage_pct: 0.05              # slippage estimate

cache:
  live_price_ttl: 60             # seconds
  fundamentals_ttl: 86400        # 24 hours
  news_ttl: 3600                 # 1 hour
  fd_rates_ttl: 86400

trade:
  min_risk_reward: 2.0           # 1:2 minimum
  risk_per_trade_pct: 1.0        # % of capital
  atr_multiplier_sl: 2.0         # ATR × 2 for stop-loss
  skip_open_minutes: 15          # skip first 15 min
  skip_close_minutes: 15         # skip last 15 min

strategies:
  ema_periods: [20, 50, 200]
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_period: 14
  adx_trend_threshold: 25
  bb_period: 20
  bb_std: 2
  supertrend_period: 7
  supertrend_multiplier: 3
  donchian_period: 52            # 52-week high/low
  volume_surge_multiplier: 1.5   # vs 20-day avg volume

data:
  default_exchange: NSE
  yfinance_suffix:
    NSE: ".NS"
    BSE: ".BO"

db:
  path: ./data/trading.db
